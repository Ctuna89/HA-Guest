name: Validate

on:
  push:
  pull_request:

permissions: {}

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest-homeassistant-custom-component segno==1.6.6
      # The integration depends on Home Assistant's frontend; install the exact version this Home Assistant pins.
      - run: >-
          python -c "import json, pathlib, homeassistant.components.frontend as f;
          print(*json.loads((pathlib.Path(f.__file__).parent / 'manifest.json').read_text())['requirements'])"
          | xargs pip install
      - run: pytest tests
