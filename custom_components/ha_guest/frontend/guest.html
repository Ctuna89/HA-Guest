<meta name="mobile-web-app-capable" content="yes">

<title>Guests</title>
<style>
  /* These variables are the whole look. A Home Assistant theme chosen by the owner overrides them at run time. */
  :root {
    --bg: #f3f4f6; --card: #ffffff; --text: #16181d; --muted: #5b6472; --line: #e5e7eb;
    --accent: #b45309; --accent-text: #ffffff; --btn: #eef0f3; --control: #848b98; --radius: 16px;
  }
  :root[data-mode="dark"] {
    --bg: #0f1115; --card: #1a1d24; --text: #f1f3f5; --muted: #9aa1ad; --line: #2a2e37;
    --accent: #fbbf24; --accent-text: #1f1300; --btn: #262a33; --control: #6f7786;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 20px 16px calc(24px + env(safe-area-inset-bottom));
  }
  main { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 8px 0 4px; }
  #welcome { margin: 0 0 4px; white-space: pre-line; }
  #expiry { color: var(--muted); font-size: 14px; margin: 0; }
  #expiry.soon { color: var(--text); font-weight: 600; }
  #content { margin-top: 20px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 24px 0 10px; }
  .grid .wide { grid-column: 1 / -1; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  [hidden] { display: none !important; }

  /* A photo behind the page, as on the dashboard: cards become frosted glass over a darkened picture. */
  #bg { position: fixed; inset: 0; z-index: -1; background: center / cover no-repeat; }
  #bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,.25), rgba(0,0,0,.55)); }
  .photo body { background: #111; }
  .photo .card, .photo .notice {
    background: color-mix(in srgb, var(--card) 55%, transparent);
    border-color: rgba(255,255,255,.12);
    -webkit-backdrop-filter: blur(22px) saturate(1.3); backdrop-filter: blur(22px) saturate(1.3);
  }
  .photo h1, .photo h2, .photo #welcome, .photo #expiry { color: #fff; text-shadow: 0 1px 10px rgba(0,0,0,.45); }
  .photo h2 { opacity: .85; }

  /* Scenes, scripts and buttons in a row of round buttons, like a dashboard's scene strip. */
  .scenes { display: grid; grid-template-columns: repeat(auto-fit, minmax(58px, 1fr)); gap: 16px 4px; }
  .scene { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0;
    border: 0; background: none; font-size: 14px; text-align: center; }
  .scene span:last-child { max-width: 100%; overflow-wrap: anywhere; font-size: 13px; }
  .scene .icon { width: 52px; height: 52px; border: 1px solid var(--control); background: var(--btn); color: var(--text); }
  .scene .icon svg { width: 26px; height: 26px; }
  .scene.fired .icon { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .scene:active .icon { transform: scale(.94); }

  .slider-label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 12px; }
  input.tone { -webkit-appearance: none; appearance: none; height: 28px; border-radius: 14px;
    background: linear-gradient(90deg, #f5a742, #fff4e0 55%, #cfe3ff); }
  input.tone::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 34px; border-radius: 5px;
    background: #fff; border: 2px solid rgba(0,0,0,.35); }
  input.tone::-moz-range-thumb { width: 10px; height: 34px; border-radius: 5px; background: #fff; border: 2px solid rgba(0,0,0,.35); }
  .head { display: flex; align-items: center; gap: 12px; min-height: 44px; }
  .icon {
    flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--btn); color: var(--muted);
    display: grid; place-items: center;
  }
  .icon[hidden] { display: none; }
  .icon svg { width: 22px; height: 22px; fill: currentColor; }
  .card.on .icon { background: var(--accent); color: var(--accent-text); }
  .label { flex: 1; min-width: 0; }
  .name { font-weight: 600; overflow-wrap: anywhere; }
  .state { color: var(--muted); font-size: 14px; }
  .row { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
  .card[aria-busy="true"] .head > button, .card[aria-busy="true"] .row { opacity: .55; pointer-events: none; }

  button { font: inherit; color: var(--text); cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .btn {
    flex: 1; min-height: 44px; border: 1px solid var(--control); border-radius: 12px; background: var(--btn);
    font-weight: 600;
  }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.run { background: transparent; border: 2px solid var(--accent); }

  .switch { flex: none; height: 44px; width: 56px; padding: 0; border: 0; background: none; }
  .switch span {
    display: block; position: relative; height: 32px; border-radius: 16px; background: var(--btn);
    border: 2px solid var(--control); transition: background .15s, border-color .15s;
  }
  .switch span::after {
    content: ""; position: absolute; top: 4px; left: 4px; width: 20px; height: 20px; border-radius: 50%;
    background: var(--control); transition: transform .15s, background .15s;
  }
  .switch[aria-checked="true"] span { background: var(--accent); border-color: var(--accent); }
  .switch[aria-checked="true"] span::after { transform: translateX(24px); background: var(--accent-text); }

  input[type=range] { flex: 1; accent-color: var(--accent); height: 44px; margin: 0; }
  .value { min-width: 52px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .value.mid { text-align: center; min-width: 64px; }
  .notice {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px 20px;
    text-align: center;
  }
  .notice p { color: var(--muted); margin: 8px 0 0; }
  .notice small { display: block; color: var(--muted); margin-top: 16px; }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #b91c1c; color: #fff;
    padding: 10px 16px; border-radius: 12px; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  const darkQuery = matchMedia("(prefers-color-scheme: dark)");
  let cards = new Map();
  let signature = null;
  let toastTimer;
  let appearance = { mode: "auto", theme: {}, accent: null };
  let appearanceKey = "";

  // The link token arrives in the address (?t=...) and is remembered so the page can be reopened until it expires.
  const TOKEN_KEY = "ha_guest_token";
  const params = new URLSearchParams(location.search);
  let token = params.get("t");
  try {
    if (token) localStorage.setItem(TOKEN_KEY, token);
    else token = localStorage.getItem(TOKEN_KEY);
  } catch (err) { /* storage can be unavailable in private windows */ }
  let auth = token ? { "X-Guest-Token": token } : {};

  // A permanent QR code (?k=...) is traded for a session on this phone, then removed from the address bar so the
  // code is not left in the browser history.
  async function redeem(key) {
    history.replaceState(null, "", location.pathname);
    let res;
    try {
      res = await fetch("/api/ha_guest/redeem", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key }),
      });
    } catch (err) {
      return;
    }
    if (!res.ok) return;
    const body = await res.json();
    token = body.token;
    auth = { "X-Guest-Token": token };
    try { localStorage.setItem(TOKEN_KEY, token); } catch (err) { /* see above */ }
  }

  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  // Black or white, whichever reads better on the given colour.
  function textOn(color) {
    const probe = el("span");
    probe.style.color = color;
    document.body.append(probe);
    const rgb = getComputedStyle(probe).color.match(/[\d.]+/g) || [0, 0, 0];
    probe.remove();
    const [r, g, b] = rgb.slice(0, 3).map(v => {
      const c = v / 255;
      return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
    });
    return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.35 ? "#16181d" : "#ffffff";
  }

  const bgEl = document.getElementById("bg");

  function applyTheme() {
    const photo = !!appearance.background;
    // White text over a darkened photo reads best, so «auto» means dark when there is a picture.
    const dark = appearance.mode === "dark" || (appearance.mode !== "light" && (photo || darkQuery.matches));
    root.classList.toggle("photo", photo);
    bgEl.hidden = !photo;
    bgEl.style.backgroundImage = photo ? `url("${appearance.background}")` : "";
    root.dataset.mode = dark ? "dark" : "light";
    THEME_VARS.forEach(name => root.style.removeProperty(name));
    const vars = (appearance.theme || {})[dark ? "dark" : "light"] || {};
    for (const [name, value] of Object.entries(vars)) {
      if (THEME_VARS.includes(name)) root.style.setProperty(name, value);
    }
    if (appearance.accent) root.style.setProperty("--accent", appearance.accent);
    if (appearance.accent || (vars["--accent"] && !vars["--accent-text"])) {
      root.style.setProperty("--accent-text", textOn(getComputedStyle(root).getPropertyValue("--accent")));
    }
  }
  darkQuery.addEventListener("change", applyTheme);
  applyTheme();

  function toast(text) {
    toastEl.textContent = text;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 3000);
  }

  // The card is dimmed and locked until Home Assistant answers, so a slow device is not toggled twice.
  async function act(card, entity_id, action, value) {
    card.setAttribute("aria-busy", "true");
    try {
      const res = await fetch("/api/ha_guest/action", {
        method: "POST", headers: { "Content-Type": "application/json", ...auth },
        body: JSON.stringify({ entity_id, action, value }),
      });
      if (res.status === 429) toast(T.rate);
      else if (!res.ok) throw new Error();
    } catch (err) {
      toast(T.failed);
    }
    await refresh();
    card.removeAttribute("aria-busy");
  }

  function button(label, onClick, cls, ariaLabel) {
    const b = el("button", "btn" + (cls ? " " + cls : ""), label);
    b.type = "button";
    if (ariaLabel) b.setAttribute("aria-label", ariaLabel);
    b.addEventListener("click", onClick);
    return b;
  }

  // The icon can change with the state (an open padlock when unlocked), so its shape is updated in place.
  function iconNode() {
    const wrap = el("span", "icon");
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("aria-hidden", "true");
    const shape = document.createElementNS("http://www.w3.org/2000/svg", "path");
    svg.append(shape);
    wrap.append(svg);
    return { wrap, set: path => { wrap.hidden = !path; if (path) shape.setAttribute("d", path); } };
  }

  function stateText(e) {
    if (e.state_text) return e.state_text;
    const domain = e.entity_id.split(".")[0];
    const label = e.state_label || STATE_LABEL[e.state] || e.state;
    if (domain === "weather" && e.attributes.temperature != null) {
      return `${label} · ${e.attributes.temperature}${e.attributes.temperature_unit || "°"}`;
    }
    if (domain === "media_player" && e.attributes.media_title) {
      return [e.attributes.media_title, e.attributes.media_artist].filter(Boolean).join(" · ");
    }
    if (e.state_label) return e.state_label;
    const unit = e.attributes.unit_of_measurement;
    if (unit) return `${e.state} ${unit}`;
    return STATE_LABEL[e.state] || e.state;
  }

  const RUNNABLE = ["scene", "script", "button", "input_button"];

  function buildScene(e) {
    const node = el("button", "scene");
    node.type = "button";
    const icon = iconNode();
    const name = el("span");
    node.append(icon.wrap, name);
    node.addEventListener("click", async () => {
      node.classList.add("fired");
      await act(node, e.entity_id, "activate");
      setTimeout(() => node.classList.remove("fired"), 600);
    });
    const update = x => {
      name.textContent = x.name;
      node.setAttribute("aria-label", `${(x.labels && x.labels.activate) || T.activate}: ${x.name}`);
      icon.set(x.icon);
    };
    update(e);
    return { node, update };
  }

  // Builds the card once and returns the function that refreshes it with new data.
  function buildCard(e) {
    const id = e.entity_id;
    const domain = id.split(".")[0];
    const card = el("div", "card");
    const head = el("div", "head");
    const label = el("div", "label");
    const name = el("div", "name");
    const state = el("div", "state");
    label.append(name, state);
    const icon = iconNode();
    head.append(icon.wrap);
    head.append(label);
    card.append(head);
    // The owner's own button texts from the layout, or the page's defaults.
    const L = action => (e.labels && e.labels[action]) || T[action];
    const row = () => { const r = el("div", "row"); card.append(r); return r; };
    const updaters = [];

    if (SWITCHES.includes(domain)) {
      const toggle = el("button", "switch");
      toggle.type = "button";
      toggle.setAttribute("role", "switch");
      toggle.append(el("span"));
      toggle.addEventListener("click", () => {
        toggle.setAttribute("aria-checked", toggle.getAttribute("aria-checked") === "true" ? "false" : "true");
        act(card, id, "toggle");
      });
      head.append(toggle);
      updaters.push(x => {
        toggle.setAttribute("aria-label", x.name);
        toggle.setAttribute("aria-checked", x.state === "on" ? "true" : "false");
        toggle.disabled = x.state === "unavailable";
      });
      const modes = e.attributes.supported_color_modes || [];
      if (domain === "light" && modes.some(m => m !== "onoff")) {
        const r = row();
        const input = el("input");
        input.type = "range"; input.min = 1; input.max = 100; input.step = 1;
        const value = el("span", "value");
        input.addEventListener("input", () => { value.textContent = `${input.value}%`; });
        input.addEventListener("change", () => act(card, id, "brightness", Number(input.value)));
        r.append(input, value);
        updaters.push(x => {
          input.setAttribute("aria-label", `${T.brightness}, ${x.name}`);
          r.hidden = x.state !== "on";
          if (document.activeElement !== input && x.attributes.brightness != null) {
            input.value = Math.max(1, Math.round(x.attributes.brightness / 2.55));
            value.textContent = `${input.value}%`;
          }
        });
      }
      if (domain === "fan" && e.attributes.percentage != null) {
        const r = row();
        const speed = el("input");
        speed.type = "range"; speed.min = 0; speed.max = 100;
        speed.step = e.attributes.percentage_step || 1;
        const value = el("span", "value");
        speed.addEventListener("input", () => { value.textContent = `${speed.value}%`; });
        speed.addEventListener("change", () => act(card, id, "percentage", Number(speed.value)));
        r.append(speed, value);
        updaters.push(x => {
          speed.setAttribute("aria-label", `${T.speed}, ${x.name}`);
          r.hidden = x.state !== "on";
          if (document.activeElement !== speed && x.attributes.percentage != null) {
            speed.value = x.attributes.percentage;
            value.textContent = `${speed.value}%`;
          }
        });
      }
      if (domain === "light" && modes.includes("color_temp")) {
        const head2 = el("div", "slider-label");
        head2.append(el("span", "", T.tone), el("span", "", `${T.warm} · ${T.cool}`));
        const r = row();
        const tone = el("input", "tone");
        tone.type = "range"; tone.step = 50;
        tone.addEventListener("change", () => act(card, id, "color_temp", Number(tone.value)));
        r.append(tone);
        card.insertBefore(head2, r);
        updaters.push(x => {
          tone.min = x.attributes.min_color_temp_kelvin || 2000;
          tone.max = x.attributes.max_color_temp_kelvin || 6500;
          tone.setAttribute("aria-label", `${T.tone}, ${x.name}`);
          r.hidden = head2.hidden = x.state !== "on";
          if (document.activeElement !== tone && x.attributes.color_temp_kelvin != null) tone.value = x.attributes.color_temp_kelvin;
        });
      }
    } else if (domain === "cover" || domain === "valve") {
      const r = row();
      const open = button(L("open"), () => act(card, id, "open"));
      const close = button(L("close"), () => act(card, id, "close"));
      r.append(open);
      if (domain === "cover") r.append(button(L("stop"), () => act(card, id, "stop")));
      r.append(close);
      updaters.push(x => {
        const position = x.attributes.current_position;
        open.disabled = position != null ? position >= 100 : x.state === "open";
        close.disabled = x.state === "closed";
      });
    } else if (["scene", "script", "button", "input_button"].includes(domain)) {
      row().append(button(L("activate"), () => act(card, id, "activate"), "run"));
      updaters.push(() => { state.textContent = ""; });
    } else if (domain === "lock") {
      const r = row();
      const unlock = button(L("unlock"), () => act(card, id, "unlock"));
      const lock = button(L("lock"), () => act(card, id, "lock"));
      r.append(unlock, lock);
      if ((e.attributes.supported_features || 0) & 1) {
        row().append(button(L("unlatch") || T.unlatch, () => act(card, id, "open")));
      }
      updaters.push(x => {
        unlock.disabled = x.state === "unlocked";
        lock.disabled = x.state === "locked";
      });
    } else if (domain === "climate") {
      const r = row();
      const value = el("span", "value mid");
      let target = null;
      const change = delta => {
        if (target != null) act(card, id, "temperature", Math.round((target + delta) * 10) / 10);
      };
      const step = e.attributes.target_temp_step || 0.5;
      r.append(button("−", () => change(-step), "", T.temp_down), value, button("+", () => change(step), "", T.temp_up));
      updaters.push(x => {
        target = x.attributes.temperature ?? null;
        value.textContent = target == null ? "–" : `${target}°`;
        const current = x.attributes.current_temperature;
        state.textContent = (x.state_text || x.state_label || STATE_LABEL[x.state] || x.state) + (current != null ? ` · ${current}°` : "");
      });
    } else if (domain === "media_player") {
      const r = row();
      const play = button((e.labels && e.labels.play_pause) || "⏯", () => act(card, id, "play_pause"), "", T.play_pause);
      if (e.attributes.volume_level != null) {
        // A volume slider where the player reports its level; − and + otherwise.
        const volume = el("input");
        volume.type = "range"; volume.min = 0; volume.max = 100; volume.step = 1;
        volume.setAttribute("aria-label", `${T.volume}, ${e.name}`);
        volume.addEventListener("change", () => act(card, id, "volume", Number(volume.value)));
        r.append(play, volume);
        play.style.flex = "0 0 64px";
        updaters.push(x => {
          if (document.activeElement !== volume && x.attributes.volume_level != null) {
            volume.value = Math.round(x.attributes.volume_level * 100);
          }
        });
      } else {
        r.append(button("−", () => act(card, id, "volume_down"), "", T.vol_down), play,
          button("+", () => act(card, id, "volume_up"), "", T.vol_up));
      }

    } else if (domain === "vacuum") {
      const r = row();
      r.append(button(L("start"), () => act(card, id, "start")), button(L("dock"), () => act(card, id, "dock")));
    }

    const update = x => {
      name.textContent = x.name;
      state.textContent = stateText(x);
      icon.set(x.icon);
      card.classList.toggle("on", ["on", "open", "playing", "unlocked", "heat", "cool", "cleaning"].includes(x.state));
      updaters.forEach(fn => fn(x));
    };
    update(e);
    return { card, update };
  }

  function notice(title, text, extra) {
    signature = null;
    cards = new Map();
    const box = el("div", "notice");
    box.append(el("strong", "", title), el("p", "", text));
    if (extra) box.append(el("small", "", extra));
    content.replaceChildren(box);
  }

  function showExpiry(expires, code) {
    if (!expires) { expiryEl.textContent = code || ""; expiryEl.className = ""; return; }
    const minutes = Math.max(0, Math.ceil((expires * 1000 - Date.now()) / 60000));
    const soon = minutes <= 15;
    expiryEl.className = soon ? "soon" : "";
    const text = soon ? T.soon.replace("{n}", minutes)
      : T.until + new Date(expires * 1000).toLocaleString([], { weekday: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    expiryEl.textContent = code ? `${code} · ${text}` : text;
  }

  function render(data) {
    titleEl.textContent = data.title;
    document.title = data.title;
    welcomeEl.textContent = data.appearance.welcome;
    showExpiry(data.expires, data.code);
    const key = JSON.stringify(data.appearance);
    if (key !== appearanceKey) {
      appearanceKey = key;
      appearance = data.appearance;
      applyTheme();
    }
    if (!data.sections.length) return notice(data.title, T.empty);

    const all = data.sections.flatMap(s => s.entities);
    const next = data.sections.map(s => `${s.title || ""}:${s.entities.map(e => e.entity_id + JSON.stringify(e.labels || {})).join(",")}`).join("|");
    if (next !== signature) {
      signature = next;
      cards = new Map();
      const nodes = [];
      for (const section of data.sections) {
        if (section.title) nodes.push(el("h2", "", section.title));
        const grid = el("div", "grid");
        let strip = null;
        for (const e of section.entities) {
          // Consecutive scenes, scripts and buttons share one card, as a row of round buttons.
          if (RUNNABLE.includes(e.entity_id.split(".")[0])) {
            if (!strip) {
              const card = el("div", "card wide");
              strip = el("div", "scenes");
              card.append(strip);
              grid.append(card);
            }
            const built = buildScene(e);
            cards.set(e.entity_id, built.update);
            strip.append(built.node);
            continue;
          }
          strip = null;
          const built = buildCard(e);
          cards.set(e.entity_id, built.update);
          grid.append(built.card);
        }
        nodes.push(grid);
      }
      content.replaceChildren(...nodes);
    } else {
      for (const e of all) cards.get(e.entity_id)?.(e);
    }
  }

  let lastOk = 0;

  async function refresh() {
    lastOk = Date.now();
    let res;
    try {
      res = await fetch(`/api/ha_guest/states?lang=${LANG}`, { cache: "no-store", headers: auth });
    } catch (err) {
      if (!cards.size) notice(T.offline, "");
      return;
    }
    if (!res.ok) {
      stopStream();
      titleEl.textContent = "";
      welcomeEl.textContent = "";
      showExpiry(null);
      if (res.status !== 403) return notice(T.off_title, T.off_text);
      const body = await res.json().catch(() => ({}));
      if (body.error === "claim" && await claim()) return refresh();
      if (body.error === "claim" || body.error === "claimed") return notice(T.claimed_title, T.claimed_text);
      if (body.error === "not_yet") {
        const when = new Date(body.starts * 1000).toLocaleString([], { weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
        return notice(T.not_yet_title, T.not_yet_text.replace("{when}", when));
      }
      if (body.error === "schedule") return notice(T.schedule_title, T.schedule_text);
      if (body.error === "link") return notice(T.link_title, body.message || T.link_text);
      if (body.error === "paused") return notice(T.paused_title, T.paused_text);
      if (body.error === "host") return notice(T.host_title, T.host_text);
      return notice(T.wifi_title, T.wifi_text, body.ip ? T.your_ip + body.ip : "");
    }
    render(await res.json());
    startStream();
  }

  // Live updates: the server sends «change» when one of the guest's entities changes, and the page refreshes.
  // While that stream is up the page only checks in once a minute; without it, every 3 seconds.
  let stream = null;
  let live = false;
  let retry = 0;
  let pending = null;

  function stopStream() {
    if (stream) stream.abort();
    stream = null;
    live = false;
  }

  async function startStream() {
    if (stream || document.hidden) return;
    const controller = new AbortController();
    stream = controller;
    try {
      const res = await fetch("/api/ha_guest/stream", { headers: auth, cache: "no-store", signal: controller.signal });
      if (!res.ok || !res.body) throw new Error(String(res.status));
      live = true;
      retry = 0;
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        const text = decoder.decode(value, { stream: true });
        if (text.includes("data: change") || text.includes("event: end")) {
          clearTimeout(pending);
          pending = setTimeout(refresh, 100);
        }
      }
    } catch (err) { /* dropped, aborted or refused: fall back to polling */ }
    const stopped = controller.signal.aborted;
    if (stream === controller) { stream = null; live = false; }
    if (!stopped && !document.hidden) {
      retry = Math.min(retry + 1, 6);
      setTimeout(startStream, 1000 * 2 ** retry);
    }
  }

  // A single-phone invitation: this phone claims it and keeps its own token from then on.
  async function claim() {
    try {
      const res = await fetch("/api/ha_guest/claim", {
        method: "POST", headers: { "Content-Type": "application/json", ...auth }, body: "{}",
      });
      if (!res.ok) return false;
      token = (await res.json()).token;
      auth = { "X-Guest-Token": token };
      try { localStorage.setItem(TOKEN_KEY, token); } catch (err) { /* storage may be unavailable */ }
      rememberLink();
      return true;
    } catch (err) {
      return false;
    }
  }

  // Keep the guest's link in the address and in the home-screen manifest, so the panel still opens once
  // installed (iPhones give installed pages their own storage, without the saved link).
  function rememberLink() {
    if (!token) return;
    document.getElementById("manifest").href = `/api/ha_guest/manifest.json?t=${encodeURIComponent(token)}`;
    if (new URLSearchParams(location.search).get("t") !== token) {
      history.replaceState(null, "", `${location.pathname}?t=${encodeURIComponent(token)}`);
    }
  }

  root.lang = LANG;
  (params.get("k") ? redeem(params.get("k")) : Promise.resolve()).then(() => { rememberLink(); refresh(); });
  setInterval(() => {
    if (!document.hidden && (!live || Date.now() - lastOk > 60000)) refresh();
  }, 3000);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) stopStream();
    else refresh();
  });
})();
</script>
</body>
</html>
